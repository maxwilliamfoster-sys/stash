<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stash">
  <title>Stash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="glass-bg" aria-hidden="true"></div>
  <main id="view"></main>

  <div id="mini" hidden>
    <div class="mini-art"></div>
    <div class="mini-text"><span class="mini-title"></span><span class="mini-artist"></span></div>
    <button type="button" class="mini-play" aria-label="Play"></button>
    <div class="mini-track"><div class="mini-bar"></div></div>
  </div>

  <nav id="tabs" aria-label="Stash"></nav>

  <section id="np" aria-label="Now playing" hidden></section>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="files" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus" hidden>
  <audio id="audio" preload="auto" playsinline></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
